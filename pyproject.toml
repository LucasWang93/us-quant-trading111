[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usquant"
version = "0.1.0"
description = "Modular research and backtesting platform for US stocks and ETFs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.48"]
dev = ["pytest>=8.0"]

[project.scripts]
usquant = "usquant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
